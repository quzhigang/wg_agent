<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水库洪水预报结果展示</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="icon" href="data:;base64,=">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="layout-grid">
        <div class="iframe-container collapsed">
            <iframe id="mainContentFrame" src="about:blank" frameborder="0"></iframe>
        </div>
        <div class="resizer resizer-h" id="resizer-sidebar"></div>
        <aside class="left-sidebar">
            <div class="main-display-area panel-style">
                <div class="avatar-box">
                    <div class="avatar-content">
                        <img src="img/szr_no_bg.png" alt="AI数字人" class="avatar-image">
                    </div>
                </div>
                <div class="process-box">
                    <div class="process-content">
                        <ul class="log-list" id="logList">
                            <li class="message-item message-system"><span class="message-text">> 系统初始化完成...</span></li>
                            <li class="message-item message-system"><span class="message-text">> 等待您的提问...</span></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="chat-input-box panel-style">
                <div class="toolbar">
                    <button id="newChatBtn" class="toolbar-btn" title="新对话">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </button>
                    <button id="historyBtn" class="toolbar-btn" title="历史对话">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    </button>
                    <button id="architectureBtn" class="toolbar-btn" title="系统架构图" style="margin-left: auto;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7zM7 9H4V5h3v4zm10 6h3v4h-3v-4zm0-10h3v4h-3V5z"/></svg>
                    </button>
                </div>
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" class="chat-input" placeholder="请输入您的问题..."></textarea>
                    <button id="chatSendBtn" class="chat-send-btn">发送</button>
                </div>
            </div>
        </aside>
    </div>

    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-dialog">
            <div class="confirm-content"><p id="confirmMessage"></p></div>
            <div class="confirm-buttons">
                <button id="confirmCancel" class="confirm-btn cancel-btn">取消</button>
                <button id="confirmOk" class="confirm-btn ok-btn">确定</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="confirm-modal">
        <div class="confirm-dialog">
            <div class="confirm-content"><p id="alertMessage"></p></div>
            <div class="confirm-buttons">
                <button id="alertOk" class="confirm-btn ok-btn">确定</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="history-modal">
        <div class="history-header"><span>历史对话</span><span id="closeHistory" class="history-close">&times;</span></div>
        <ul id="historyListContainer" class="history-list"></ul>
    </div>

    <script src="js/resizer.js"></script>
    <script>
        (function() {
            let currentConversationId = null;

            const chatInput = document.getElementById('chatInput');
            const chatSendBtn = document.getElementById('chatSendBtn');
            const logList = document.getElementById('logList');
            const mainContentFrame = document.getElementById('mainContentFrame');
            const historyModal = document.getElementById('historyModal');
            const historyListContainer = document.getElementById('historyListContainer');

            window.toggleProcess = function(header) {
                const container = header.closest('.execution-process');
                if (container) container.classList.toggle('collapsed');
            };

            function renderMarkdown(text) {
                if (window.marked && window.marked.parse) {
                    const renderer = new marked.Renderer();
                    renderer.link = function(token) {
                        var href = token.href || '';
                        var linkText = token.text || href;
                        return '<a href="' + href + '" target="_blank" rel="noopener">' + linkText + '</a>';
                    };
                    return window.marked.parse(text, { renderer: renderer });
                }
                return text.split(String.fromCharCode(10)).join('<br>');
            }

            function scrollToBottom() {
                setTimeout(() => {
                    const box = document.querySelector('.process-box');
                    if (box) box.scrollTop = box.scrollHeight;
                }, 50);
            }

            window.addLog = function(text, type = 'system') {
                const li = document.createElement('li');
                li.className = 'message-item message-' + type;
                if (type === 'user') {
                    li.innerHTML = '<div class="message-content"><div class="message-icon user-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div class="message-bubble">' + text + '</div></div>';
                } else if (type === 'assistant') {
                    li.innerHTML = '<div class="message-content"><img src="img/xw.png" class="message-icon assistant-icon-img"><div class="message-bubble markdown-content">' + renderMarkdown(text) + '</div></div>';
                } else {
                    li.innerHTML = '<span class="message-text">' + text + '</span>';
                }
                logList.appendChild(li);
                scrollToBottom();
                return li;
            };

            async function sendMessage() {
                const message = chatInput.value.trim();
                if (!message) return;

                addLog(message, 'user');
                chatInput.value = '';

                const assistantLi = document.createElement('li');
                assistantLi.className = 'message-item message-assistant';
                assistantLi.innerHTML = `
                    <div class="message-content" style="width: 100%;">
                        <img src="img/xw.png" alt="小卫" class="message-icon assistant-icon-img">
                        <div class="message-bubble" style="flex: 1; max-width: none;">
                            <div class="execution-process" style="width: 100%;">
                                <div class="process-header" onclick="toggleProcess(this)">
                                    <span class="toggle-icon">▼</span><span>智能体执行过程</span>
                                </div>
                                <div class="process-body">
                                    <div class="intent-status process-item">
                                        <span class="process-icon">⏳</span><span>正在分析意图...</span>
                                    </div>
                                </div>
                            </div>
                            <div class="final-answer markdown-content">
                                <div class="typing-dots"><span></span><span></span><span></span></div>
                            </div>
                        </div>
                    </div>`;
                logList.appendChild(assistantLi);
                scrollToBottom();

                const uiElements = {
                    assistantLi,
                    processBody: assistantLi.querySelector('.process-body'),
                    finalAnswer: assistantLi.querySelector('.final-answer'),
                    executionProcess: assistantLi.querySelector('.execution-process'),
                    processHeaderSpan: assistantLi.querySelector('.process-header span:last-child')
                };

                try {
                    const response = await fetch('/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message, user_id: 'user123', conversation_id: currentConversationId })
                    });

                    if (!response.ok) throw new Error('HTTP ' + response.status);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split(String.fromCharCode(10));
                        buffer = lines.pop();

                        for (let i = 0; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line.startsWith('data:')) continue;
                            const jsonStr = line.substring(5).trim();
                            try {
                                const data = JSON.parse(jsonStr);
                                handleEvent(data, uiElements);
                            } catch (e) {}
                        }
                    }
                } catch (err) {
                    uiElements.finalAnswer.innerHTML = '<div style="color:#ff4d4f">连接异常: ' + err.message + '</div>';
                }
            }

            function handleEvent(data, ui) {
                console.log('[DEBUG] Received event:', data.type, data);  // 调试日志

                // 意图类别中文映射
                const categoryMap = {
                    'chat': '一般对话',
                    'knowledge': '知识查询',
                    'business': '业务操作'
                };
                // 业务子意图中文映射
                const subIntentMap = {
                    'data_query': '监测数据查询',
                    'flood_forecast': '洪水预报',
                    'flood_simulation': '洪水预演',
                    'emergency_plan': '预案生成',
                    'damage_assessment': '灾损评估',
                    'other': '其他业务'
                };
                // 工作流ID到中文名称映射
                const workflowNameMap = {
                    'get_auto_forecast_result': '查询最新自动预报结果',
                    'get_history_autoforecast_result': '查询历史自动预报结果',
                    'flood_autoforecast_getresult': '启动自动预报并获取结果',
                    'get_manual_forecast_result': '查询人工预报结果',
                    'flood_manualforecast_getresult': '启动人工预报并获取结果'
                };

                switch (data.type) {
                    case 'start': currentConversationId = data.conversation_id; break;
                    case 'intent_stage':
                        // 分阶段意图识别事件
                        const stageEl = ui.assistantLi.querySelector('.intent-status');
                        if (stageEl) {
                            const stage = data.stage || 0;
                            const stageName = data.stage_name || '';

                            if (stageName === 'intent_category') {
                                // 第1阶段：显示意图类别
                                const category = data.intent_category || '';
                                const categoryName = categoryMap[category] || category;
                                const confidence = Math.round((data.confidence || 0) * 100);

                                if (category === 'business') {
                                    // 业务类：显示类别，等待子意图
                                    stageEl.innerHTML = '<span class="process-icon" style="color:#00d4ff">⏳</span><span>意图识别: <span style="color:#00d4ff;font-weight:500">' + categoryName + '</span> <span style="color:#a0aec0">(' + confidence + '%)</span> <span style="color:#a0aec0;font-size:12px">正在分析子意图...</span></span>';
                                } else {
                                    // 非业务类：直接完成
                                    stageEl.innerHTML = '<span class="process-icon" style="color:#00ff9d">✓</span><span>意图识别: <span style="color:#00d4ff;font-weight:500">' + categoryName + '</span> <span style="color:#a0aec0">(' + confidence + '%)</span></span>';
                                }
                            } else if (stageName === 'business_sub_intent') {
                                // 第2阶段：追加业务子意图
                                const subIntent = data.business_sub_intent || '';
                                const subIntentName = subIntentMap[subIntent] || subIntent;

                                // 获取当前显示的类别
                                const currentHtml = stageEl.innerHTML;
                                const confidenceMatch = currentHtml.match(/\((\d+)%\)/);
                                const confidence = confidenceMatch ? confidenceMatch[1] : '90';

                                stageEl.innerHTML = '<span class="process-icon" style="color:#00d4ff">⏳</span><span>意图识别: <span style="color:#00d4ff;font-weight:500">业务操作</span> > <span style="color:#00ff9d;font-weight:500">' + subIntentName + '</span> <span style="color:#a0aec0">(' + confidence + '%)</span> <span style="color:#a0aec0;font-size:12px">正在匹配工作流...</span></span>';
                            } else if (stageName === 'workflow_match') {
                                // 第3阶段：工作流匹配完成
                                const matchedWorkflow = data.matched_workflow || '';
                                const subIntent = data.business_sub_intent || '';
                                const subIntentName = subIntentMap[subIntent] || subIntent;

                                // 获取当前显示的置信度
                                const currentHtml = stageEl.innerHTML;
                                const confidenceMatch = currentHtml.match(/\((\d+)%\)/);
                                const confidence = confidenceMatch ? confidenceMatch[1] : '90';

                                // 构建意图文本
                                let intentText = '<span style="color:#00d4ff;font-weight:500">业务操作</span>';
                                if (subIntentName) {
                                    intentText += ' > <span style="color:#00ff9d;font-weight:500">' + subIntentName + '</span>';
                                }
                                intentText += ' <span style="color:#a0aec0">(' + confidence + '%)</span>';

                                // 添加工作流名称（使用中文）
                                if (matchedWorkflow) {
                                    const workflowDisplayName = workflowNameMap[matchedWorkflow] || matchedWorkflow;
                                    intentText += ' <span style="color:#00ffd4;font-size:12px">→ ' + workflowDisplayName + '</span>';
                                }

                                stageEl.innerHTML = '<span class="process-icon" style="color:#00ff9d">✓</span><span>意图识别: ' + intentText + '</span>';
                            }
                        }
                        break;
                    case 'intent':
                        // 兼容旧的完整意图事件
                        const intentEl = ui.assistantLi.querySelector('.intent-status');
                        if (intentEl) {
                            const category = data.intent_category || '';
                            const categoryName = categoryMap[category] || category;
                            const subIntent = data.business_sub_intent || '';
                            const subIntentName = subIntentMap[subIntent] || subIntent;
                            const matchedWorkflow = data.matched_workflow || '';
                            const confidence = Math.round((data.confidence || 0) * 100);

                            let intentText = '';
                            if (category === 'business' && subIntent) {
                                // 业务类：显示类别 > 子意图
                                intentText = '<span style="color:#00d4ff;font-weight:500">' + categoryName + '</span> > <span style="color:#00ff9d;font-weight:500">' + subIntentName + '</span> <span style="color:#a0aec0">(' + confidence + '%)</span>';
                            } else {
                                // 非业务类：显示类别名称
                                intentText = '<span style="color:#00d4ff;font-weight:500">' + categoryName + '</span> <span style="color:#a0aec0">(' + confidence + '%)</span>';
                            }

                            intentEl.innerHTML = '<span class="process-icon" style="color:#00ff9d">✓</span><span>意图识别: ' + intentText + '</span>';
                        }
                        break;
                    case 'rag':
                        // 只有检索到知识时才显示
                        if (data.doc_count && data.doc_count > 0) {
                            const ragDiv = document.createElement('div');
                            ragDiv.className = 'process-item';
                            ragDiv.innerHTML = '<span class="process-icon">📚</span><span>检索到 ' + data.doc_count + ' 条相关知识</span>';
                            ui.processBody.appendChild(ragDiv);
                        }
                        break;
                    case 'plan':
                        const planDiv = document.createElement('div');
                        planDiv.className = 'process-item';
                        planDiv.innerHTML = '<div style="width:100%"><div style="margin-bottom:5px;color:var(--text-muted)">执行计划:</div><div class="steps-container" style="padding-left:10px"></div></div>';
                        ui.processBody.appendChild(planDiv);
                        const container = planDiv.querySelector('.steps-container');
                        (data.steps || []).forEach((s, index) => {
                            const sEl = document.createElement('div');
                            sEl.className = 'step-item';
                            sEl.setAttribute('data-id', s.step_id);
                            sEl.innerHTML = '<span class="step-dot"></span><span>步骤' + s.step_id + '：' + s.description + '</span><span class="step-status"></span>';
                            // 第一个步骤立即开始闪烁
                            if (index === 0) {
                                sEl.classList.add('active');
                                sEl.querySelector('.step-status').innerHTML = '<div class="loading-spinner-small"></div>';
                            }
                            container.appendChild(sEl);
                        });
                        break;
                    case 'step_start':
                        // step_start 事件现在作为备用，主要逻辑在 plan 和 step_end 中处理
                        const startEl = ui.assistantLi.querySelector('.step-item[data-id="' + data.step_id + '"]');
                        if (startEl && !startEl.classList.contains('active') && !startEl.classList.contains('completed')) {
                            startEl.classList.add('active');
                            startEl.querySelector('.step-status').innerHTML = '<div class="loading-spinner-small"></div>';
                        }
                        break;
                    case 'step_end':
                        const endEl = ui.assistantLi.querySelector('.step-item[data-id="' + data.step_id + '"]');
                        if (endEl) {
                            endEl.classList.remove('active');
                            endEl.classList.add('completed');
                            endEl.querySelector('.step-status').innerHTML = '<span style="color:#28a745">✓</span>';
                            // 让下一个步骤开始闪烁
                            const nextEl = ui.assistantLi.querySelector('.step-item[data-id="' + (data.step_id + 1) + '"]');
                            if (nextEl && !nextEl.classList.contains('completed')) {
                                nextEl.classList.add('active');
                                nextEl.querySelector('.step-status').innerHTML = '<div class="loading-spinner-small"></div>';
                            }
                        }
                        break;
                    case 'content':
                        // 兼容旧逻辑（文字+页面一起返回）
                        if (data.data) {
                            ui.finalAnswer.innerHTML = renderMarkdown(data.data);
                        }
                        if (data.page_url) {
                            mainContentFrame.src = data.page_url;
                            // 触发展开动画
                            if (window.expandIframePanel) {
                                window.expandIframePanel();
                            }
                        }
                        break;
                    case 'page_generating':
                        // 页面开始生成，可以显示loading提示（可选）
                        console.log('[DEBUG] 页面生成中...');
                        break;
                    case 'final_text':
                        // 文字回复完成，立即显示（不等待页面）
                        if (data.data) {
                            ui.finalAnswer.innerHTML = renderMarkdown(data.data);
                            scrollToBottom();
                        }
                        break;
                    case 'final_page':
                        // 页面生成完成，更新iframe并展开
                        if (data.page_url) {
                            mainContentFrame.src = data.page_url;
                            // 触发展开动画
                            if (window.expandIframePanel) {
                                window.expandIframePanel();
                            }
                        }
                        break;
                    case 'page_error':
                        // 页面生成失败，显示提示
                        console.warn('[WARN] 页面生成失败:', data.error);
                        break;
                    case 'done':
                        if (ui.executionProcess) ui.executionProcess.classList.add('collapsed');
                        if (ui.processHeaderSpan) ui.processHeaderSpan.textContent = '执行过程 (已完成)';
                        scrollToBottom();
                        break;
                    case 'error':
                        ui.finalAnswer.innerHTML = '<div style="color:#ff4d4f">错误: ' + (data.data || '未知错误') + '</div>';
                        break;
                }
            }

            chatSendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            document.getElementById('newChatBtn').addEventListener('click', () => {
                currentConversationId = null;
                logList.innerHTML = '<li class="message-item message-system"><span class="message-text">> 开启新对话...</span></li>';
                mainContentFrame.src = 'about:blank';
                // 新对话时折叠左侧iframe
                if (window.collapseIframePanel) {
                    window.collapseIframePanel();
                }
            });

            document.getElementById('historyBtn').addEventListener('click', async () => {
                try {
                    const res = await fetch('/chat/conversations?user_id=user123');
                    const result = await res.json();
                    if (result.success) {
                        historyListContainer.innerHTML = '';
                        (result.data || []).forEach(conv => {
                            const li = document.createElement('li');
                            li.className = 'history-item';
                            li.innerHTML = '<input type="checkbox" class="history-checkbox" data-id="' + conv.id + '">' +
                                '<span class="history-title">' + (conv.title || conv.id) + '</span>' +
                                '<button class="delete-single-btn" title="删除此对话" data-id="' + conv.id + '">' +
                                '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
                                '</button>';
                            // 点击标题加载对话
                            li.querySelector('.history-title').addEventListener('click', () => loadConversation(conv.id));
                            // 点击删除按钮删除对话
                            li.querySelector('.delete-single-btn').addEventListener('click', async (e) => {
                                e.stopPropagation();  // 阻止事件冒泡
                                const convId = e.currentTarget.getAttribute('data-id');
                                if (confirm('确定要删除这条对话记录吗？')) {
                                    try {
                                        const delRes = await fetch('/chat/conversations/' + convId, { method: 'DELETE' });
                                        const delResult = await delRes.json();
                                        if (delResult.success) {
                                            li.remove();  // 从列表中移除该项
                                            // 如果删除的是当前对话，清空当前对话ID
                                            if (currentConversationId === convId) {
                                                currentConversationId = null;
                                            }
                                        } else {
                                            alert('删除失败: ' + (delResult.message || '未知错误'));
                                        }
                                    } catch (err) {
                                        alert('删除请求失败: ' + err.message);
                                    }
                                }
                            });
                            historyListContainer.appendChild(li);
                        });
                        historyModal.style.display = 'flex';
                    }
                } catch (e) {}
            });

            document.getElementById('closeHistory').addEventListener('click', () => { historyModal.style.display = 'none'; });

            document.getElementById('architectureBtn').addEventListener('click', () => {
                window.open('mindmap_classic.html', '_blank');
            });

            async function loadConversation(id) {
                currentConversationId = id;
                historyModal.style.display = 'none';
                logList.innerHTML = '<li class="message-item message-system"><span class="message-text">> 正在加载历史对话...</span></li>';
                try {
                    const res = await fetch('/chat/conversations/' + id + '/messages');
                    const result = await res.json();
                    if (result.success) {
                        logList.innerHTML = '';
                        result.data.forEach(m => addLog(m.content, m.role === 'user' ? 'user' : 'assistant'));
                    }
                } catch (e) { addLog('> 错误: 无法加载历史消息'); }
            }
        })();
    </script>
</body>
</html>
